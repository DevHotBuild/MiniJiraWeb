<h2>Tasks ({{ visibleCount() }})</h2>

<div class="filters">
  @for (option of statusOptions; track option) {
    <button (click)="setFilter(option)" [class.active]="statusFilter() === option">
      {{ option }}
    </button>
  }
</div>

<table class="issue-table">
  <thead>
    <tr>
      <th>Key</th>
      <th>Type</th>
      <th>Title</th>
      <th>Status</th>
      <th>Priority</th>
      <th>Assigned user</th>
    </tr>
  </thead>
  <tbody>
    @for (issue of filteredIssues(); track issue.id) {
      <tr app-issue-row [issue]="issue"></tr>
    } @empty {
      <tr>
        <td colspan="6" class="muted">No tasks</td>
      </tr>
    }
  </tbody>
</table>
